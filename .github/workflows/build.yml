name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: .\with-devenv.ps1 cmake -B out/rel -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: .\with-devenv.ps1 cmake --build out/rel

      - name: Rename executable
        run: |
          cp out/rel/repro.exe out/rel/amd-vram-leak-repro.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd-vram-leak-repro
          path: out/rel/amd-vram-leak-repro.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/rel/amd-vram-leak-repro.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
